services:
  # Single service: Express API + Expo landing page + QR code
  - type: web
    name: replit-assistant
    env: node
    region: frankfurt
    buildCommand: npm install -g pnpm@10.26.1 && bash scripts/render-build.sh
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false          # set in Render dashboard
      - key: SESSION_SECRET
        sync: false          # set in Render dashboard
      # Hostname of THIS service (without https://).
      # Example: replit-assistant.onrender.com
      # Used during build to embed the correct URL in the Expo QR code.
      - key: EXPO_PUBLIC_DOMAIN
        sync: false          # set in Render dashboard before first deploy
